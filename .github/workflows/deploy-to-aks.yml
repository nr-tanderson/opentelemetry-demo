name: OpenTelemetry Astronomy Shop on shared AKS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy this fork's commit or uninstall only the Astronomy Shop
        type: choice
        default: deploy
        options: [deploy, uninstall]
      enable_monitoring:
        description: Enable New Relic only after separately configuring a new lab key
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: shared-aks-opentelemetry-demo
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: lab-application
    env:
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      OTEL_OPERATION: ${{ inputs.operation }}
      MONITORING_ENABLED: ${{ inputs.enable_monitoring && 'true' || 'false' }}
      NEW_RELIC_LICENSE_KEY: ${{ inputs.enable_monitoring && secrets.LAB_NR_LICENSE_KEY || '' }}
      NEW_RELIC_OTLP_ENDPOINT: ${{ vars.NEW_RELIC_OTLP_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.10
      - name: Validate optional monitoring credential
        if: ${{ inputs.enable_monitoring }}
        run: ': "${NEW_RELIC_LICENSE_KEY:?Configure a new LAB_NR_LICENSE_KEY before opting in}"'
      - name: Operate under the shared lab lock
        run: bash scripts/lab-lock.sh bash scripts/deploy-aks.sh